# aForum Beta 1.1 — KISS: wesentliche Einstellungen
# Andere Farben über die Discourse-Farbpalette einstellen.

color_accent_light:
  type: string
  default: ""
  description: "Akzent Hell (Buttons, Antwortzahlen, aktiver Sidebar-Eintrag). Leer = Palette quaternary."

color_accent_dark:
  type: string
  default: ""
  description: "Akzent Dunkel. Leer = Palette quaternary."

max_width:
  type: integer
  default: 1320
  min: 900
  max: 2000
  description: "Maximale Breite der Forenfläche in px (Desktop)."

compact_lists:
  type: bool
  default: true
  description: "Dichtere Kategorietabelle: kleinere Schrift, Beschreibungen auf zwei Zeilen gekürzt."

lock_parent_category_links:
  type: bool
  default: true
  description: "Links der Überkategorien auf der Kategorien-Startseite für Mausklicks deaktivieren. Unterkategorien bleiben anklickbar. Tastatur-Links bleiben technisch erhalten."

subcategory_tiles:
  type: bool
  default: true
  description: "Unterkategorien als gleich große Link-Kacheln darstellen. Aus = bisherige kompakte Textlinks."

subcategory_columns:
  type: integer
  default: 2
  min: 1
  max: 3
  description: "Spalten für die Unterkategorien unter jeder Kategorie (Listenansicht)."

panel_shadow:
  type: bool
  default: true
  description: "Schatten um die Forenfläche aktivieren."

shadow_opacity:
  type: integer
  default: 18
  min: 0
  max: 60
  description: "Stärke des Forenflächenschattens in Prozent (0–60)."

header_height:
  type: integer
  default: 80
  min: 56
  max: 140
  description: "Header-Höhe auf Desktop in px (mobil bleibt die optimierte Höhe erhalten)."

avatar_radius:
  type: integer
  default: 3
  min: 0
  max: 50
  description: "Eckenradius aller Benutzeravatare in px (0 = eckig, 50 = rund bei üblichen Avatargrößen)."

bar_height:
  type: integer
  default: 52
  min: 36
  max: 80
  description: "Höhe der horizontalen Navigationsleiste in px."

banner_subtitle_color_light:
  type: string
  default: "#0f7ec9"
  description: "Banner-Untertitel im hellen Modus: HEX-Farbcode mit # (z. B. #0F7EC9)."

banner_subtitle_color_dark:
  type: string
  default: "#0f7ec9"
  description: "Banner-Untertitel im dunklen Modus: HEX-Farbcode mit # (z. B. #0F7EC9)."

nav_background_enabled:
  type: bool
  default: true
  description: "Hintergrundfläche der horizontalen Navigationsleiste anzeigen (Navigation und Neues Thema bleiben sichtbar)."

color_nav_light:
  type: string
  default: ""
  description: "Hintergrundfarbe der Navigationsleiste im hellen Modus als HEX-Code (#RRGGBB). Leer = bisherige Header-Hintergrundfarbe."

color_nav_dark:
  type: string
  default: ""
  description: "Hintergrundfarbe der Navigationsleiste im dunklen Modus als HEX-Code (#RRGGBB). Leer = bisherige Header-Hintergrundfarbe."
